<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coalition 509 — Connexion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="brand">
        <h1>Coalition <span>509</span></h1>
      </div>
      <p class="subtitle">VoteConnect Ecosystem — ChallengeFinancier™</p>

      <div class="tabs">
        <button class="tab-btn active" data-tab="login">Connexion</button>
        <button class="tab-btn" data-tab="register">Inscription</button>
      </div>

      <!-- FORMULAIRE CONNEXION -->
      <form id="login-form">
        <div class="form-group">
          <label>Numéro de téléphone</label>
          <input type="tel" name="phone" placeholder="Ex : +509 34 56 78 90" required>
        </div>
        <div class="form-group">
          <label>Code PIN</label>
          <input type="password" name="pin" placeholder="Votre code PIN" maxlength="4" required>
        </div>
        <button type="submit" class="btn-submit">Se connecter</button>
      </form>

      <!-- FORMULAIRE INSCRIPTION -->
      <form id="register-form" style="display:none;">
        <div class="form-group">
          <label>Numéro de téléphone <span class="required">*</span></label>
          <input type="tel" name="phone" placeholder="Ex : +225 07 07 77 77 77" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Prénom <span class="required">*</span></label>
            <input type="text" name="first_name" placeholder="Prénom" required>
          </div>
          <div class="form-group">
            <label>Nom <span class="required">*</span></label>
            <input type="text" name="last_name" placeholder="Nom" required>
          </div>
        </div>
        <div class="form-group">
          <label>Email (optionnel)</label>
          <input type="email" name="email" placeholder="email@exemple.com">
        </div>
        <div class="form-group">
          <label>Code PIN <span class="required">*</span></label>
          <input type="password" name="pin" placeholder="4 chiffres" maxlength="4" required>
        </div>
        <div class="form-group">
          <label>Confirmer le PIN <span class="required">*</span></label>
          <input type="password" name="pin_confirm" placeholder="Confirmez le PIN" maxlength="4" required>
        </div>
        <div class="form-group">
          <label>Type de profil</label>
          <select name="profile_type">
            <option value="Animateur NGD" selected>Animateur NGD</option>
            <option value="Coach">Coach</option>
            <option value="Administrateur">Administrateur</option>
            <option value="Membre">Membre</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Région</label>
            <input type="text" name="region" placeholder="Région">
          </div>
          <div class="form-group">
            <label>Commune</label>
            <input type="text" name="commune" placeholder="Commune">
          </div>
        </div>
        <button type="submit" class="btn-submit">Créer mon compte</button>
      </form>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
