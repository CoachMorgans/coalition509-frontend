<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coalition 509 — Connexion</title>
  <link rel="stylesheet" href="style.css?v=4">
  <style>
    .mode-switcher {
      display: flex;
      gap: 0;
      margin-bottom: 20px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #e0e0e0;
    }
    .mode-switcher button {
      flex: 1;
      padding: 12px 16px;
      border: none;
      background: #f5f5f5;
      color: #666;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-switcher button.active {
      background: linear-gradient(135deg, #D4AF37, #228B22);
      color: #fff;
    }
    .mode-switcher button:hover:not(.active) {
      background: #e8e8e8;
    }
    .admin-hint {
      font-size: 12px;
      color: #888;
      text-align: center;
      margin-top: -12px;
      margin-bottom: 16px;
      display: none;
    }
    .admin-hint.visible {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card card-auth" id="auth-container">
      <div class="brand">
        <h1>Coalition <span>509</span></h1>
      </div>
      <p class="subtitle">VoteConnect Ecosystem — ChallengeFinancier™</p>

      <!-- SELECTEUR MODE CONNEXION -->
      <div class="mode-switcher">
        <button class="active" id="mode-user" data-mode="user">👤 Utilisateur</button>
        <button id="mode-admin" data-mode="admin">🔒 Administrateur</button>
      </div>
      <p class="admin-hint" id="admin-hint">Mode administrateur — connexion uniquement</p>

      <div class="tabs">
        <button class="tab-btn active" id="tab-login" data-tab="login">Connexion</button>
        <button class="tab-btn" id="tab-register" data-tab="register">Inscription</button>
      </div>

      <!-- FORMULAIRE CONNEXION -->
      <form id="login-form">
        <div class="form-group">
          <label>Numéro de téléphone</label>
          <input type="tel" id="login-phone" name="phone" placeholder="Ex : +509 34 56 78 90" required>
        </div>
        <div class="form-group">
          <label>Code PIN</label>
          <input type="password" id="login-pin" name="pin" placeholder="Votre code PIN" maxlength="4" required>
        </div>
        <button type="submit" class="btn-submit">Se connecter</button>
      </form>

      <!-- FORMULAIRE INSCRIPTION -->
      <form id="register-form" style="display:none;">
        <div class="form-group">
          <label>Numéro de téléphone <span class="required">*</span></label>
          <input type="tel" id="reg-phone" name="phone" placeholder="Ex : +225 07 07 77 77 77" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Prénom <span class="required">*</span></label>
            <input type="text" id="reg-firstname" name="first_name" placeholder="Prénom" required>
          </div>
          <div class="form-group">
            <label>Nom <span class="required">*</span></label>
            <input type="text" id="reg-lastname" name="last_name" placeholder="Nom" required>
          </div>
        </div>
        <div class="form-group">
          <label>Email (optionnel)</label>
          <input type="email" id="reg-email" name="email" placeholder="email@exemple.com">
        </div>
        <div class="form-group">
          <label>Code PIN <span class="required">*</span></label>
          <input type="password" id="reg-pin" name="pin" placeholder="4 chiffres" maxlength="4" required>
        </div>
        <div class="form-group">
          <label>Confirmer le PIN <span class="required">*</span></label>
          <input type="password" id="reg-pin-confirm" name="pin_confirm" placeholder="Confirmez le PIN" maxlength="4" required>
        </div>
        <div class="form-group">
          <label>Type de profil</label>
          <select id="reg-profile" name="profile_type">
            <option value="Animateur NGD" selected>Animateur NGD</option>
            <option value="Coach">Coach</option>
            <option value="Administrateur">Administrateur</option>
            <option value="Membre">Membre</option>
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Région</label>
            <input type="text" id="reg-region" name="region" placeholder="Région">
          </div>
          <div class="form-group">
            <label>Commune</label>
            <input type="text" id="reg-commune" name="commune" placeholder="Commune">
          </div>
        </div>
        <button type="submit" class="btn-submit">Créer mon compte</button>
      </form>

    </div>
  </div>

  <script src="app.js?v=9"></script>
</body>
</html>
