 AJOUTER CE BLOC dans dashboard.html, par exemple apres 
 la section #overview-stats ou dans la section Overview
 ============================================================ -->

<!-- Script Chart.js (une seule fois dans le head ou avant la fermeture body) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>

<!-- Section Stats Bot -->
<section id="bot-stats-section" class="card" style="margin-top:24px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h3 style="margin:0;">🤖 Stats Bot <span id="bot-version" class="badge" style="font-size:12px;background:#3b82f6;color:#fff;padding:2px 8px;border-radius:4px;"></span></h3>
        <p class="muted" style="margin:0;font-size:12px;color:#888;">Derniere mise a jour : <span id="bot-last-update">—</span></p>
    </div>
    <p id="bot-stats-error" class="text-error" style="font-size:13px;"></p>

    <div class="stats-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px;">
        <div class="stat-card" style="border-left:4px solid #3b82f6;">
            <div class="stat-value" id="bot-conversations" style="color:#3b82f6;font-size:28px;font-weight:700;">0</div>
            <div class="stat-label" style="font-size:13px;color:#666;">Conversations totales</div>
        </div>
        <div class="stat-card" style="border-left:4px solid #f59e0b;">
            <div class="stat-value" id="bot-active" style="color:#f59e0b;font-size:28px;font-weight:700;">0</div>
            <div class="stat-label" style="font-size:13px;color:#666;">Actives</div>
        </div>
        <div class="stat-card" style="border-left:4px solid #10b981;">
            <div class="stat-value" id="bot-leads" style="color:#10b981;font-size:28px;font-weight:700;">0</div>
            <div class="stat-label" style="font-size:13px;color:#666;">Leads generes</div>
        </div>
        <div class="stat-card" style="border-left:4px solid #8b5cf6;">
            <div class="stat-value" id="bot-conversions" style="color:#8b5cf6;font-size:28px;font-weight:700;">0</div>
            <div class="stat-label" style="font-size:13px;color:#666;">Conversions</div>
        </div>
        <div class="stat-card" style="border-left:4px solid #ec4899;">
            <div class="stat-value" id="bot-messages" style="color:#ec4899;font-size:28px;font-weight:700;">0</div>
            <div class="stat-label" style="font-size:13px;color:#666;">Messages envoyes</div>
        </div>
    </div>

    <div id="bot-week-summary" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;padding:12px;background:#f8fafc;border-radius:8px;"></div>

    <div style="position:relative;height:200px;">
        <canvas id="bot-stats-chart"></canvas>
    </div>
</section>
